models:
  - name: int_sightings
    description: "Integration model for sightings data from all regions"
    columns:
      - name: date_witness
        description: "The date the witness observed the sighting"
        tests:
          - not_null
      - name: date_agent
        description: "The date the agent observed the sighting"
        tests:
          - not_null
      - name: witness
        description: "Name of the witness"
        tests:
          - not_null
      - name: agent
        description: "Name of the agent"
        tests:
          - not_null
      - name: city_agent
        description: "City where the agent is located"
        tests:
          - not_null
      - name: country
        description: "Country where the sighting occurred"
        tests:
          - not_null
      - name: city
        description: "City where the sighting occurred"
        tests:
          - not_null
      - name: latitude
        description: "Latitude of the sighting location"
        tests:
          - not_null
      - name: longitude
        description: "Longitude of the sighting location"
        tests:
          - not_null
      - name: has_weapon
        description: "Indicates if a weapon was present (boolean)"
        tests:
          - not_null
      - name: has_hat
        description: "Indicates if a hat was present (boolean)"
        tests:
          - not_null
      - name: has_jacket
        description: "Indicates if a jacket was present (boolean)"
        tests:
          - not_null
      - name: behavior
        description: "Behavior observed during the sighting"
  - name: dim_agency
    description: "Dimension model for agency data"
    columns:
      - name: agency_key
        description: "MD5 key for the agency"
        tests:
          - not_null
          - unique
      - name: agency_city
        description: "City where the agency is located"
        tests:
          - not_null
      - name: agency_region
        description: "Region where the agency is located"
  - name: dim_agent
    description: "Dimension model for agent data"
    columns:
      - name: agent_key
        description: "MD5 key for the agent"
        tests:
          - not_null
          - unique
  - name: dim_witness
    description: "Dimension model for witness data"
    columns:
      - name: witness_key
        description: "MD5 key for the witness"
        tests:
          - not_null
          - unique
  - name: dim_temporal
    description: "Dimension model for temporal data"
    columns:
      - name: date_key
        description: "Date key in YYYYMMDD format"
        tests:
          - not_null
          - unique
  - name: dim_location
    description: "Dimension model for location data"
    columns:
      - name: location_key
        description: "MD5 key for the location"
        tests:
          - not_null
          - unique
      - name: city
        description: "City of the sighting"
        tests:
          - not_null
      - name: country_code
        description: "Country code of the sighting"
        tests:
          - not_null
      - name: latitude
        description: "Latitude of the sighting location"
        tests:
          - not_null
      - name: longitude
        description: "Longitude of the sighting location"
        tests:
          - not_null
  - name: dim_attribute
    description: "Dimension model for item attributes or items carried"
    columns:
      - name: has_weapon
        description: "Indicates if a weapon was present (boolean)"
        tests:
          - not_null
      - name: has_hat
        description: "Indicates if a hat was present (boolean)"
        tests:
          - not_null
      - name: has_jacket
        description: "Indicates if a jacket was present (boolean)"
        tests:
          - not_null
      - name: has_weapon_has_jacket_no_hat
        description: "Indicates if a weapon and jacket were present but no hat (boolean)"
        tests:
          - not_null
      - name: attribute_count
        description: "Count of attributes present (weapon, hat, jacket)"
        tests:
          - not_null
      - name: attribute_text
        description: "Textual representation of the attributes present"
        tests:
          - not_null