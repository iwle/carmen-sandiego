models:
  - name: dim_agency
    description: "Dimension model for agency data"
    columns:
      - name: agency_key
        description: "MD5 key for the agency"
        tests:
          - not_null
          - unique
      - name: agency_city
        description: "City where the agency is located"
        tests:
          - not_null
      - name: agency_region
        description: "Region where the agency is located"
  - name: dim_agent
    description: "Dimension model for agent data"
    columns:
      - name: agent_key
        description: "MD5 key for the agent"
        tests:
          - not_null
          - unique
  - name: dim_witness
    description: "Dimension model for witness data"
    columns:
      - name: witness_key
        description: "MD5 key for the witness"
        tests:
          - not_null
          - unique
  - name: dim_temporal
    description: "Dimension model for temporal data"
    columns:
      - name: temporal_key 
        description: "Date key in YYYYMMDD format"
        tests:
          - not_null
          - unique
  - name: dim_location
    description: "Dimension model for location data"
    columns:
      - name: location_key
        description: "MD5 key for the location"
        tests:
          - not_null
          - unique
      - name: city
        description: "City of the sighting"
        tests:
          - not_null
      - name: country_code
        description: "Country code of the sighting"
        tests:
          - not_null
      - name: latitude
        description: "Latitude of the sighting location"
        tests:
          - not_null
      - name: longitude
        description: "Longitude of the sighting location"
        tests:
          - not_null
  - name: dim_attribute
    description: "Dimension model for item attributes or items carried"
    columns:
      - name: has_weapon
        description: "Indicates if a weapon was present (boolean)"
        tests:
          - not_null
      - name: has_hat
        description: "Indicates if a hat was present (boolean)"
        tests:
          - not_null
      - name: has_jacket
        description: "Indicates if a jacket was present (boolean)"
        tests:
          - not_null
      - name: has_weapon_has_jacket_no_hat
        description: "Indicates if a weapon and jacket were present but no hat (boolean)"
        tests:
          - not_null
      - name: attribute_count
        description: "Count of attributes present (weapon, hat, jacket)"
        tests:
          - not_null
      - name: attribute_text
        description: "Textual representation of the attributes present"
  - name: dim_behavior
    description: "Dimension model for behavior data"
    columns:
      - name: behavior
        description: "Behavior observed during the sighting"
        tests:
          - not_null
  - name: fact_sightings
    description: "Fact model for sightings data"
    columns:
      - name: sighting_key
        description: "MD5 key for the sighting"
        tests:
          - not_null
          - unique
      - name: witness_date_key
        description: "Char of witness date"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_temporal')
                field: temporal_key
      - name: report_date_key
        description: "Char of report date"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_temporal')
                field: temporal_key
      - name: witness_key
        description: "Foreign key to dim_witness"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_witness')
                field: witness_key
      - name: agent_key
        description: "Foreign key to dim_agent"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agent')
                field: agent_key
      - name: agency_key
        description: "Foreign key to dim_agency"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agency')
                field: agency_key
      - name: location_key
        description: "Foreign key to dim_location"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: attribute_key
        description: "Foreign key to dim_attribute"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_attribute')
                field: attribute_key
      - name: behavior_key
        description: "Foreign key to dim_behavior"
        tests:
          - relationships:
              arguments:
                to: ref('dim_behavior')
                field: behavior_key
