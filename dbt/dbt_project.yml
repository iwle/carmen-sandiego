name: carmen_dbt

profile: carmen_dbt

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  carmen_dbt:
    +schema: src

models:
  carmen_dbt:
    +quote_columns: true
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +schema: stg
      +materialized: view
    marts:
      +materialized: table
    warehouse:
      +materialized: table
      +schema: warehouse
